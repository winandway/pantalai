<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pantalay</title>
    <style>
      :root {
        --tinta: #16181d;
        --gris: #6b7280;
        --borde: #e2e4e9;
        --fondo-suave: #f6f7f9;
        --rojo: #e5484d;
        --rojo-oscuro: #c93a3f;
        --exito: #1f9d55;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 320px;
        padding: 14px;
        font:
          14px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--tinta);
        background: #fff;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      header img {
        width: 28px;
        height: 28px;
      }
      header strong {
        font-size: 16px;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--gris);
        margin: 0 0 6px;
      }
      .interruptor {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        padding: 9px 10px;
        margin-bottom: 6px;
        border: 1px solid var(--borde);
        border-radius: 10px;
        background: #fff;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .interruptor:hover {
        background: var(--fondo-suave);
      }
      .interruptor .estado {
        font-size: 12px;
        font-weight: 600;
        color: var(--gris);
      }
      .interruptor[aria-pressed='true'] {
        border-color: var(--exito);
      }
      .interruptor[aria-pressed='true'] .estado {
        color: var(--exito);
      }
      .aviso {
        font-size: 12px;
        color: var(--gris);
        background: var(--fondo-suave);
        border-radius: 8px;
        padding: 8px;
        margin: 0 0 8px;
      }
      .principal {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border: 0;
        border-radius: 10px;
        background: var(--rojo);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .principal:hover {
        background: var(--rojo-oscuro);
      }
      .secundario {
        width: 100%;
        padding: 9px;
        margin-top: 6px;
        border: 1px solid var(--borde);
        border-radius: 10px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      p.ayuda {
        font-size: 12px;
        color: var(--gris);
        margin: 6px 0 0;
      }
      a {
        color: #2563eb;
        font-size: 12px;
      }
      footer {
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="iconos/icono-48.png" alt="" />
      <strong>Pantalay</strong>
    </header>
    <h2 data-i18n="enEstaPagina"></h2>
    <p class="aviso" id="no-permitida" hidden data-i18n="noPermitida"></p>
    <button type="button" class="interruptor" id="dibujo" aria-pressed="false">
      <span data-i18n="dibujar"></span><span class="estado"></span>
    </button>
    <button type="button" class="interruptor" id="cursor" aria-pressed="false">
      <span data-i18n="cursor"></span><span class="estado"></span>
    </button>
    <p class="ayuda" data-i18n="atajos"></p>
    <button type="button" class="principal" id="reporte" data-i18n="reporte"></button>
    <p class="ayuda" data-i18n="reporteAyuda"></p>
    <button type="button" class="secundario" id="abrir" data-i18n="abrir"></button>
    <footer>
      <a
        href="https://pantalay.com/docs/chrome-extension"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="comoFunciona"
      ></a>
    </footer>
    <script src="ventanita.js"></script>
  </body>
</html>
