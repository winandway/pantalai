name: verify
# Tipos + estilo + pruebas con cobertura + compilación + auditoría + secretos, y la prueba
# de punta a punta que graba de verdad con Chrome. Todo en verde o no se publica.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run verify
      - name: Secretos (gitleaks, todo el historial)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  punta-a-punta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npx wrangler d1 execute pantalai-local --local --file schema.sql
      - name: Sitio local + grabación real con Chrome
        run: |
          npx wrangler dev --local --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/datos/salud && break; sleep 1; done
          npx playwright test
      - if: failure()
        run: tail -100 wrangler.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: resultado-e2e, path: test-results }
