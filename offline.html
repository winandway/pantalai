<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>No connection · Pantalay</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, sans-serif; color: #16181d; background: #fff; padding: 16px; box-sizing: border-box; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.4rem; margin: 16px 0 6px; }
      p { color: #4a4f5a; margin: 0 0 18px; line-height: 1.5; }
      button { border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: 1rem; background: #e5484d; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Pantalay" />
      <h1 id="t">You are offline</h1>
      <p id="p">Pantalay needs an internet connection. Your recordings in progress stay safe on this device.</p>
      <button id="b" type="button">Try again</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
